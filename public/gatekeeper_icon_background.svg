<!-- Android Adaptive Icon - Background Layer -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgCanvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191B22"/>
      <stop offset="45%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>

    <!-- Ambient Center Indigo Glow -->
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B6CF0" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#34D399" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#121318" stop-opacity="0"/>
    </radialGradient>

    <!-- Faint Pattern Grid/Dots for Texture -->
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Full Bleed Background Canvas for Android Adaptive Icon (No clipping; Android applies mask) -->
  <rect width="512" height="512" fill="url(#bgCanvasGrad)"/>
  
  <!-- Subtle Texture Grid -->
  <rect width="512" height="512" fill="url(#dotGrid)"/>

  <!-- Ambient Light Well in safe center -->
  <circle cx="256" cy="256" r="230" fill="url(#centerAura)"/>

  <!-- Concentric Calm Breathing Wave Rings in Background -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="2"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#5B6CF0" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#34D399" stroke-opacity="0.06" stroke-width="1.5"/>
</svg>
